plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def signingProps = new Properties()
rootProject.file('.signing.env').with { if (it.exists()) it.withInputStream { s -> signingProps.load(s) } }
def signingValue = { String key -> System.getenv(key) ?: signingProps.getProperty(key) }
def useTestAds = true
def keystoreFile = rootProject.file('memodrop-upload.keystore')

android {
    namespace 'com.memodrop'
    compileSdk 36

    defaultConfig {
        applicationId "com.memo.drop"
        minSdk 24
        targetSdk 36
        versionCode 9
        versionName "1.0"
    }

    signingConfigs {
        if (keystoreFile.exists() && signingValue('MEMODROP_KEYSTORE_PASSWORD')) {
            release {
                storeFile keystoreFile
                storePassword signingValue('MEMODROP_KEYSTORE_PASSWORD')
                keyAlias signingValue('MEMODROP_KEY_ALIAS')
                keyPassword signingValue('MEMODROP_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            resValue 'string', 'admob_app_id', 'ca-app-pub-3940256099942544~3347511713'
            resValue 'string', 'admob_banner_id', 'ca-app-pub-3940256099942544/6300978111'
        }
        release {
            resValue 'string', 'admob_app_id', useTestAds ? 'ca-app-pub-3940256099942544~3347511713' : 'ca-app-pub-5419101132706357~9886207186'
            resValue 'string', 'admob_banner_id', useTestAds ? 'ca-app-pub-3940256099942544/6300978111' : 'ca-app-pub-5419101132706357/6669851059'
            if (signingConfigs.findByName('release')) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.android.billingclient:billing:9.1.0'
}
